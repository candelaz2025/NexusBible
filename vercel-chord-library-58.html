function note(n,a,flat){const k=n[0].toUpperCase()+n.slice(1),i=IDX[k];if(i==null)return n;return (flat?FLAT:SHARP)[(i+a%12+12)%12]}
function chord(tok,a){const lead=(tok.match(/^[([{<"'|]+/)||[''])[0],tail=(tok.match(/[)\]}>",.;:!?|]+$/)||[''])[0],core=tok.slice(lead.length,tok.length-tail.length),m=core.match(TOKEN);if(!m)return null;const root=m[1].toUpperCase()+(m[2]||''),suf=m[3]||'',bass=m[4]?m[4].toUpperCase()+(m[5]||''):'';if(!/^(?:maj|min|dim|aug|sus|add|m|M|[0-9#b()+-])*$/i.test(suf))return null;const flat=root.includes('b')||bass.includes('b');return lead+note(root,a,flat)+suf+(bass?'/'+note(bass,a,flat):'')+tail}
function renderSong(){const s=SONGS[cur];$('vtitle').textContent=s.title;$('vindex').textContent=String(s.id).padStart(2,'0')+' / '+SONGS.length;sheet.innerHTML='';for(const line of s.lines){const r=document.createElement('div');r.className='line';if(!line){r.innerHTML='&nbsp;';sheet.appendChild(r);continue}let hits=0;for(const p of line.split(/(\s+)/)){if(/^\s+$/.test(p)){r.appendChild(document.createTextNode(p));continue}const c=chord(p,shift);if(c!==null){const sp=document.createElement('span');sp.className='chord';sp.textContent=c;r.appendChild(sp);hits++}else r.appendChild(document.createTextNode(p))}if(hits&&!/[ก-๙]/.test(line))r.classList.add('pure');sheet.appendChild(r)}sel.value=String(shift);body.scrollTo(0,0)}

function closeSong(){viewer.classList.remove('on');document.body.style.overflow='';history.replaceState(null,'',location.pathname)}
function step(d){cur=(cur+d+SONGS.length)%SONGS.length;shift=0;renderSong();location.hash='song-'+SONGS[cur].id}
$('back').onclick=closeSong;$('down').onclick=()=>{shift=Math.max(-11,shift-1);renderSong()};$('up').onclick=()=>{shift=Math.min(11,shift+1);renderSong()};$('reset').onclick=()=>{shift=0;renderSong()};sel.onchange=e=>{shift=Number(e.target.value);renderSong()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();list=SONGS.filter(s=>s.title.toLowerCase().includes(q));renderList()};document.addEventListener('keydown',e=>{if(!viewer.classList.contains('on'))return;if(e.key==='Escape')closeSong();if(e.key==='['){shift=Math.max(-11,shift-1);renderSong()}if(e.key===']'){shift=Math.min(11,shift+1);renderSong()}if(e.key==='0'){shift=0;renderSong()}});renderList();const m=location.hash.match(/song-(\d+)/);if(m)openSong(Number(m[1]));
</script></body></html>
